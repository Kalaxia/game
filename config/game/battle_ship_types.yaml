# Combat profiles of the ship types for the new battle system (combat simulator only for now).
# See docs/fleet-combat/ship-stats.md for the meaning of each stat and how the values were derived.
#
# Weapon patterns (Q12): see docs/fleet-combat/content-proposal.md. Squadrons turn freely, so only
# min_range, splash_ratio and split_fire restrict fire for now.
#
# Types linked to a `ship_category` take their base stats (class, pev, life, defense, speed, attack)
# from config/game/ship_categories.yaml. Types without a ship category (e.g. the bomber) define them here.
battle_ship_types:
    LightFighter:
        ship_category: !php/enum App\Modules\Ares\Domain\Model\ShipCategory::LightFighter->value
        pictogram: Intercepteur
        role: interceptor
        squadron_size: 50
        movement: 3
        initiative: 195
        range: 1
        preferred_targets: [0, 1]
        patterns: [close]

    Fighter:
        ship_category: !php/enum App\Modules\Ares\Domain\Model\ShipCategory::Fighter->value
        pictogram: fighter
        role: interceptor
        squadron_size: 33
        movement: 3
        initiative: 185
        range: 1
        preferred_targets: [0, 1]
        patterns: [close]

    HeavyFighter:
        ship_category: !php/enum App\Modules\Ares\Domain\Model\ShipCategory::HeavyFighter->value
        pictogram: ChasseurSW
        role: interceptor
        squadron_size: 33
        movement: 3
        initiative: 195
        range: 1
        preferred_targets: [0, 1]
        patterns: [close]
        split_fire: true

    LightCorvette:
        ship_category: !php/enum App\Modules\Ares\Domain\Model\ShipCategory::LightCorvette->value
        pictogram: corvette
        role: escort
        squadron_size: 20
        movement: 3
        initiative: 190
        range: 2
        preferred_targets: [0, 1]
        patterns: [broadside]

    Corvette:
        ship_category: !php/enum App\Modules\Ares\Domain\Model\ShipCategory::Corvette->value
        pictogram: corvette
        role: line
        squadron_size: 14
        movement: 2
        initiative: 165
        # Range 2 since 2026-10-08: with range 1 it was outranged and rarely fired
        range: 2
        preferred_targets: [1, 2]
        patterns: [frontal_cone]

    HeavyCorvette:
        ship_category: !php/enum App\Modules\Ares\Domain\Model\ShipCategory::HeavyCorvette->value
        pictogram: corvette
        role: escort
        squadron_size: 11
        movement: 2
        initiative: 145
        range: 2
        preferred_targets: [0, 1]
        patterns: [broadside, close]

    LightFrigate:
        ship_category: !php/enum App\Modules\Ares\Domain\Model\ShipCategory::LightFrigate->value
        pictogram: frigate
        role: line
        squadron_size: 4
        movement: 1
        initiative: 100
        range: 2
        preferred_targets: [1, 2]
        patterns: [frontal_cone]

    Frigate:
        ship_category: !php/enum App\Modules\Ares\Domain\Model\ShipCategory::Frigate->value
        pictogram: frigate
        role: artillery
        squadron_size: 2
        movement: 1
        initiative: 90
        range: 3
        preferred_targets: [3, 2]
        patterns: [ring]
        min_range: 2

    Destroyer:
        ship_category: !php/enum App\Modules\Ares\Domain\Model\ShipCategory::Destroyer->value
        pictogram: cruiser
        role: line
        squadron_size: 1
        movement: 1
        initiative: 88
        range: 2
        preferred_targets: [2, 3]
        patterns: [frontal_cone]

    HeavyDestroyer:
        ship_category: !php/enum App\Modules\Ares\Domain\Model\ShipCategory::HeavyDestroyer->value
        pictogram: cruiser
        role: artillery
        squadron_size: 1
        movement: 1
        initiative: 75
        range: 4
        preferred_targets: [1, 0]
        patterns: [area]
        min_range: 2
        splash_ratio: 0.5

    Cruiser:
        ship_category: !php/enum App\Modules\Ares\Domain\Model\ShipCategory::Cruiser->value
        pictogram: cruiser
        role: capital
        squadron_size: 1
        movement: 1
        initiative: 80
        range: 3
        preferred_targets: [3, 2]
        patterns: [frontal_cone, close]

    HeavyCruiser:
        ship_category: !php/enum App\Modules\Ares\Domain\Model\ShipCategory::HeavyCruiser->value
        pictogram: cruiser
        role: capital
        squadron_size: 1
        movement: 1
        initiative: 75
        range: 3
        preferred_targets: [3, 2]
        patterns: [frontal_cone, broadside]
