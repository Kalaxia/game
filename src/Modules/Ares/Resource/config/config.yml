---
parameters:
    ares.commander.base_level: 100
    ares.commander.income_level: 200

    ares.coeff.move_in_system: 584
    ares.coeff.move_out_of_system: 600
    ares.coeff.move_intersystem: 1000

    ares.coeff.colonization_cost: 80000
    ares.coeff.conquest_cost: 150000

    ares.loot_limit: 5000
    ares.coeff.loot: 275

    # New battle system (docs/fleet-combat/plan.md)
    ares.battle.turn_duration: '%env(int:BATTLE_TURN_DURATION)%'
    ares.battle.battlefield_size: 5
    ares.battle.fleet_area_radius: 4
    ares.battle.formation_radius: 2
    # Tuned with app:ares:simulate-battles to reach the duration targets of D1 (see docs/fleet-combat/plan.md)
    ares.battle.durability_factor: 3.0
    ares.battle.max_firing_squadrons_per_fleet: 2
    # Officer experience per point of damage dealt or taken, before the importance weighting (D6)
    ares.battle.experience_per_damage: 2.0
    
services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        App\Shared\Application\SchedulerInterface:
            tags: ['app.scheduler']

    App\Modules\Ares\:
        resource: '%kernel.project_dir%/src/Modules/Ares/'
        exclude:
            - '../../Message'
            - '../../Model'
            - '../../Resource'

    App\Modules\Ares\Domain\Service\Battle\BuildFleetFormation:
        arguments:
            $compositionRadius: '%ares.battle.formation_radius%'

    App\Modules\Ares\Domain\Service\Battle\ValidateFormation:
        arguments:
            $compositionRadius: '%ares.battle.formation_radius%'

    App\Modules\Ares\Domain\Service\Battle\ComputeBattleExperience:
        arguments:
            $experiencePerDamage: '%ares.battle.experience_per_damage%'

    App\Modules\Ares\Manager\ConquestManager:
        arguments:
            $colonizationCost: '%ares.coeff.colonization_cost%'
            $conquestCost: '%ares.coeff.conquest_cost%'
